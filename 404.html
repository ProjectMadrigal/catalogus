<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina niet gevonden · Project Madrigal</title>
  <meta name="theme-color" content="#1b1b1c">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>
    // Adressen van de oude website sturen we door naar de nieuwe pagina's.
    (function () {
      var pad = location.pathname.replace(/\/+$/, '').toLowerCase();
      var naar = {
        '/boeken': 'boeken.html',
        '/over-project-madrigal': 'over-ons.html',
        '/over-ons': 'over-ons.html',
        '/home': 'index.html'
      };
      var basis = location.pathname.replace(/[^\/]*\/?$/, '');
      Object.keys(naar).forEach(function (oud) {
        if (pad.slice(-oud.length) === oud) location.replace(basis + naar[oud]);
      });
    })();
  </script>
  <style>
    body { font-family: system-ui, sans-serif; background: #1b1b1c; color: #f2f2f2; text-align: center; padding: 4rem 1rem; }
    a { color: #ffcd30; }
  </style>
</head>
<body>
  <h1>Deze pagina bestaat niet (meer)</h1>
  <p lang="en">This page does not exist (anymore).</p>
  <p><a href="./">Naar de startpagina</a> · <a href="boeken.html">Naar de boeken</a></p>
</body>
</html>
